server_tokens off;

upstream api_upstream {
    server api:8000;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Debe ser algo mayor que el máximo de PDF que acepta la API (10 MB).
    client_max_body_size 12m;

    # API y endpoint CSRF de Sanctum: misma origin para el navegador,
    # así no hace falta abrir CORS. Los headers de seguridad los pone la API.
    location ~ ^/(api|sanctum)/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # SPA de Angular.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        # same-origin: el token del enlace nunca viaja como Referer a otros sitios,
        # pero Sanctum sí recibe Referer/Origin para reconocer al SPA.
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # 'unsafe-inline' solo para estilos: Angular inyecta los estilos de componentes en <style>.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        try_files $uri $uri/ /index.html;
    }
}
